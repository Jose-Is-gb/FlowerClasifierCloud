<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clasificador de Flores</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Clasificador de Flores – Oxford 102</h1>

<div class="grid">
    {% for item in data %}
    <div class="card {% if item.correcta %}ok{% else %}bad{% endif %}">
        <img src="{{ item.ruta }}" alt="Flor">

        <div class="text">
            <p class="pred"><b>Predicción:</b> {{ item.pred }}</p>
            <p class="real"><b>Real:</b> {{ item.real }}</p>
        </div>
    </div>
    {% endfor %}
</div>

</body>
</html>
